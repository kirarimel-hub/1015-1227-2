<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOWYA（ロウヤ）</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 600px; height: 95vh; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #007bff; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        #sync-status { font-size: 0.7rem; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; }
        #media-section { background: #111; padding: 10px; }
        #sync-start-btn { width: 100%; background: #ff9800; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        #youtube-player { width: 100%; height: 220px; background: #000; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .my-messages { align-self: flex-end; align-items: flex-end; }
        .other-messages { align-self: flex-start; align-items: flex-start; }
        .message { padding: 8px 12px; border-radius: 15px; background: #e4e6eb; font-size: 0.9rem; }
        .my-messages .message { background: #007bff; color: white; }
        #input-container { display: flex; padding: 10px; border-top: 1px solid #eee; gap: 8px; }
        #message-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        #send-btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">
        <span>LOWYAチャット</span>
        <div id="sync-status">同期待機中...</div>
    </div>

    <div id="media-section">
        <button id="sync-start-btn">🎥 視聴開始（まずこれをタップ）</button>
        <div id="youtube-player"></div>
    </div>

    <div id="messages"></div>

    <div id="input-container">
        <input type="text" id="message-input" placeholder="メッセージ...">
        <button id="send-btn">送信</button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, collection, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDkCdoQOuL9Kh0T0P9CCJPL39WMkT5t-nw",
        authDomain: "project-2987921418155591586.firebaseapp.com",
        projectId: "project-2987921418155591586",
        storageBucket: "project-2987921418155591586.firebasestorage.app",
        messagingSenderId: "34152717352",
        appId: "1:34152717352:web:244bc26dbcf8dec5b7691d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let player = null;
    let isRemoteUpdate = false; // ループ防止フラグ

    // YouTubeプレイヤー生成
    window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('youtube-player', {
            videoId: 'JFf3uASYM4E',
            events: {
                'onStateChange': (e) => {
                    if (isRemoteUpdate) return;
                    // 操作をFirebaseに書き込む
                    const state = e.data === YT.PlayerState.PLAYING ? 'play' : 'pause';
                    setDoc(doc(db, "sync", "player"), {
                        action: state,
                        time: player.getCurrentTime(),
                        timestamp: Date.now()
                    });
                }
            }
        });
    };

    // 視聴開始ボタン（ブラウザのロック解除）
    document.getElementById('sync-start-btn').onclick = () => {
        player.playVideo();
        setTimeout(() => player.pauseVideo(), 500);
        document.getElementById('sync-status').textContent = "🟢 同期中";
    };

    // Firebaseの「状態」を監視（これが同期の心臓部）
    onSnapshot(doc(db, "sync", "player"), (docSnap) => {
        if (!docSnap.exists() || !player) return;
        const data = docSnap.data();
        
        isRemoteUpdate = true; // 自分が操作したと判定させない

        // 時間のズレが1.5秒以上ならシーク
        if (Math.abs(player.getCurrentTime() - data.time) > 1.5) {
            player.seekTo(data.time, true);
        }

        // 再生・停止の反映
        if (data.action === 'play') player.playVideo();
        else player.pauseVideo();

        setTimeout(() => { isRemoteUpdate = false; }, 500);
    });

    // メッセージ機能はそのまま
    document.getElementById('send-btn').onclick = async () => {
        const input = document.getElementById('message-input');
        if(!input.value) return;
        await addDoc(collection(db, "messages"), { text: input.value, createdAt: serverTimestamp() });
        input.value = '';
    };

    onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "asc")), (snap) => {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        snap.forEach(d => {
            const div = document.createElement('div');
            div.className = 'message-wrapper';
            div.innerHTML = `<div class="message">${d.data().text}</div>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    });
</script>
</body>
</html>
